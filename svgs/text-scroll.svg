<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="100%">
  <foreignObject x="0" y="0" width="900" height="60">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&amp;display=swap" rel="stylesheet"/>

      <style>
        .text-wrapper {
          width: 100%;
          height: 60px;
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .typing {
          font-family: 'Comic Neue', cursive, sans-serif;
          font-size: 32px;
          font-weight: 700;
          color: #ff8c00;
          text-align: center;
          white-space: nowrap;
        }

        .typing::after {
          content: "";
          animation: loop 14s infinite steps(1);
        }

        @keyframes loop {
          /* xTymezz */
          0% { content: ""; }
          2% { content: "x"; }
          3% { content: "xT"; }
          4% { content: "xTy"; }
          5% { content: "xTym"; }
          6% { content: "xTyme"; }
          7% { content: "xTymez"; }
          8% { content: "xTymezz"; }

          /* backspace */
          13% { content: "xTymez"; }
          13.5% { content: "xTyme"; }
          14% { content: "xTym"; }
          14.5% { content: "xTy"; }
          15% { content: "xT"; }
          15.5% { content: "x"; }
          16% { content: ""; }

          /* World's youngest coder, */
          18% { content: "W"; }
          18.5% { content: "Wo"; }
          19% { content: "Wor"; }
          19.5% { content: "Worl"; }
          20% { content: "World"; }
