          24% { content: "World's young"; }
          24.5% { content: "World's younge"; }
          25% { content: "World's youngest"; }
          25.5% { content: "World's youngest "; }
          26% { content: "World's youngest c"; }
          26.5% { content: "World's youngest co"; }
          27% { content: "World's youngest cod"; }
          27.5% { content: "World's youngest code"; }
          28% { content: "World's youngest coder"; }
          28.5% { content: "World's youngest coder!"; }

          /* backspace */
          33% { content: "World's youngest coder"; }
          33.5% { content: "World's youngest code"; }
          34% { content: "World's youngest cod"; }
          34.5% { content: "World's youngest co"; }
          35% { content: "World's youngest c"; }
