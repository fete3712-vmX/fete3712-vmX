name: upd

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Increase v
        run: |
          V=$(cat .card-version 2>/dev/null || echo 0)
          V=$((V + 1))
          echo "$V" > .card-version

          sed -i -E 's/([?&])v=[0-9]+/\1v='"$V"'/g' README.md

      - name: Commit changes
        run: |
          git config user.name "[bot] update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md .card-version
          git commit -m "chore: update card version"
          git push
